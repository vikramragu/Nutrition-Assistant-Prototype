# Railway build configuration (architecture.md §12.3, implementation-plan.md Phase 2.9).
#
# One job: download the 64 MiB of ONNX embedding weights at **build** time so the container
# never fetches them at boot. Measured 2026-10-04 — warm model load 0.09 s, cold load with a
# download 15 s — and a boot that depends on Hugging Face being reachable is a deploy that
# fails on a slow day. Railway retries a failed boot, so the real failure mode is a redeploy
# loop rather than one slow start.
#
# The weights land in `backend/.fastembed_cache`, which is `services.embeddings.CACHE_PATH`
# — the same constant the running app reads. Setting `FASTEMBED_CACHE_PATH` on Railway is
# therefore optional; the default already points at the baked location, so forgetting the
# variable cannot quietly reintroduce the boot-time download.
#
# This file is checked in rather than set as a dashboard Build Command so the build step is
# reviewable and travels with the repo. If Nixpacks ignores it, the equivalent dashboard
# setting is: Settings → Build → Build Command:
#     python scripts/prefetch_embedding_model.py
#
# UNVERIFIED: Nixpacks has not been run against this file. docs/deployment.md §5 already
# flags that Nixpacks' Python detection was never validated for this project, and the build
# phase below inherits that uncertainty. Read Railway's build log on the first deploy and
# confirm the prefetch output appears in it — the deployment runbook says exactly what to
# look for, because a skipped build phase does not fail the deploy, it just moves the
# download back to boot where it is invisible until it is slow.

[phases.build]
dependsOn = ["install"]
cmds = ["python scripts/prefetch_embedding_model.py"]
